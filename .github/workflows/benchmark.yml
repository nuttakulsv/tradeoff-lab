name: Benchmark

on:
  workflow_dispatch:
    inputs:
      quick:
        description: Run each scenario for 20% of its duration
        type: boolean
        default: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: rm -f results/*.json
      - run: npm run lab -- run all all ${{ inputs.quick && '--quick' || '' }}
      - run: npm run lab -- stats && npm run lab -- report
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/
            docs/charts/
      - run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
